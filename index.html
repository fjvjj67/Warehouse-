<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>خريطة المخزن 3D - AZAWI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: one-screen tool. Search bar on top, room strip, 3D map fills the rest; details dock as a side sheet on wide screens, bottom sheet on phones. */
:root {
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f5f7fa; --border:#dde2ea; --border-strong:#c3cad6;
  --text:#152033; --text-secondary:#4d5a70; --text-muted:#8590a3;
  --accent:#1f5fa8; --accent-dark:#174a85; --accent-soft:#e3edf9;
  --loc-bg:#ffd34d; --loc-text:#3a2a00;
  --success-bg:#e4f5ea; --success-text:#17703c;
  --danger-bg:#fde8e6; --danger-text:#b42318;
  --warn-bg:#fff3d1; --warn-text:#8a5a00;
  --scene:#e9edf3; --shadow:0 10px 30px rgba(21,32,51,.12);
  --font-body:'IBM Plex Sans Arabic',-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;
  --font-code:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0e131b; --panel:#161d28; --panel-2:#1c2533; --border:#273243; --border-strong:#36445a;
    --text:#e8edf5; --text-secondary:#a7b2c4; --text-muted:#6d7a8f;
    --accent:#5b9bea; --accent-dark:#7db0f0; --accent-soft:#1b2c44;
    --loc-bg:#f2c53d; --loc-text:#2a1f00;
    --success-bg:#12301f; --success-text:#5fd690;
    --danger-bg:#3a1714; --danger-text:#ff8a7d;
    --warn-bg:#382a0b; --warn-text:#f2c25a;
    --scene:#1a2230; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0e131b; --panel:#161d28; --panel-2:#1c2533; --border:#273243; --border-strong:#36445a;
  --text:#e8edf5; --text-secondary:#a7b2c4; --text-muted:#6d7a8f;
  --accent:#5b9bea; --accent-dark:#7db0f0; --accent-soft:#1b2c44;
  --loc-bg:#f2c53d; --loc-text:#2a1f00;
  --success-bg:#12301f; --success-text:#5fd690;
  --danger-bg:#3a1714; --danger-text:#ff8a7d;
  --warn-bg:#382a0b; --warn-text:#f2c25a;
  --scene:#1a2230; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family:var(--font-body); background:var(--panel); color:var(--text); font-size:14px; overflow:hidden; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
.room-chip, .top-view-btn, .tool-btn, .legend { -webkit-user-select:none; user-select:none; }
button, input, select { font-family:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.app { display:flex; flex-direction:column; height:100%; position:relative; }
.gutter { padding-left:max(12px, env(safe-area-inset-left,0px)); padding-right:max(12px, env(safe-area-inset-right,0px)); }

.topbar { background:var(--panel); border-bottom:1px solid var(--border); padding-block:10px; display:flex; gap:12px; align-items:center; flex-shrink:0; }
.brand { display:flex; flex-direction:column; line-height:1.15; flex-shrink:0; }
.brand b { font-size:15px; font-weight:700; letter-spacing:.02em; }
.brand span { font-size:11px; color:var(--text-muted); }
.search { flex:1; display:flex; align-items:center; gap:8px; min-width:0; background:var(--panel-2); border:1px solid var(--border-strong); border-radius:10px; padding-inline:10px; }
.search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.search svg { flex-shrink:0; color:var(--text-muted); }
.search input { flex:1; min-width:0; border:none; background:transparent; color:var(--text); font-size:15px; padding-block:10px; }
.search input:focus { outline:none; }
.topbar .primary { padding:10px 16px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
.topbar .primary:hover { background:var(--accent-dark); }
@media (max-width:520px) { .brand { display:none; } }

.room-chips { display:flex; gap:6px; overflow-x:auto; padding-block:8px; background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.room-chip { flex-shrink:0; padding:5px 12px; border-radius:8px; border:1px solid var(--border); background:var(--panel-2); color:var(--text-secondary); font-size:13px; font-weight:600; font-family:var(--font-code); cursor:pointer; white-space:nowrap; }
.room-chip.corr { border-style:dashed; }
.room-chip:hover { border-color:var(--border-strong); color:var(--text); }
.room-chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }

.body-area { flex:1; display:flex; min-height:0; position:relative; }
.canvas-wrap { flex:1; position:relative; background:var(--scene); overflow:hidden; }
#canvas-container { width:100%; height:100%; touch-action:none; }
.map-tools { position:absolute; top:12px; left:12px; display:flex; flex-direction:column; gap:8px; z-index:5; }
.top-view-btn { background:var(--panel); color:var(--text); border:1px solid var(--border-strong); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer; box-shadow:var(--shadow); }
.legend { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:11px; color:var(--text-secondary); display:grid; gap:5px; box-shadow:var(--shadow); }
.legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-left:6px; vertical-align:-1px; }
@media (max-width:520px) { .legend { display:none; } }

.result-panel { position:absolute; bottom:12px; left:12px; right:12px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow); display:none; max-height:55%; overflow-y:auto; z-index:6; }
.result-panel.show { display:block; }
@media (min-width:820px) { .result-panel { left:auto; right:16px; top:16px; bottom:auto; width:360px; max-height:calc(100% - 32px); } }
.result-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:12px; }
.result-title { font-size:17px; font-weight:700; text-wrap:balance; }
.result-sku { font-size:12px; color:var(--text-muted); font-family:var(--font-code); margin-top:2px; }
.close-btn { background:none; border:none; font-size:22px; color:var(--text-muted); cursor:pointer; line-height:1; padding:2px 6px; border-radius:6px; }
.close-btn:hover { background:var(--panel-2); color:var(--text); }
.location-code { display:flex; align-items:center; gap:8px; background:var(--loc-bg); color:var(--loc-text); font-weight:700; font-size:20px; padding:10px 14px; border-radius:10px; font-family:var(--font-code); margin-bottom:12px; direction:ltr; justify-content:flex-end; letter-spacing:.04em; }
.info-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-bottom:12px; }
.info-item { background:var(--panel-2); border-radius:8px; padding:8px 10px; min-width:0; }
.info-item .l { font-size:11px; color:var(--text-muted); letter-spacing:.02em; }
.info-item .v { font-size:15px; font-weight:700; margin-top:3px; font-variant-numeric:tabular-nums; font-family:var(--font-code); }
.badge { display:inline-block; padding:3px 8px; border-radius:6px; font-size:12px; font-weight:700; font-family:var(--font-body); }
.badge.ok { background:var(--success-bg); color:var(--success-text); }
.badge.out { background:var(--danger-bg); color:var(--danger-text); }
.badge.low { background:var(--warn-bg); color:var(--warn-text); }
.not-found { position:absolute; bottom:12px; left:12px; right:12px; background:var(--danger-bg); color:var(--danger-text); border-radius:12px; padding:14px; font-size:14px; font-weight:600; display:none; z-index:6; }
.not-found.show { display:block; }

.footer { background:var(--panel); border-top:1px solid var(--border); padding-block:8px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; flex-shrink:0; }
.kpis { display:flex; gap:6px; flex-wrap:wrap; }
.kpi { font-size:12px; padding:3px 9px; border-radius:6px; background:var(--panel-2); color:var(--text-secondary); font-variant-numeric:tabular-nums; }
.kpi b { color:var(--text); }
.kpi.out { background:var(--danger-bg); color:var(--danger-text); } .kpi.out b { color:inherit; }
.kpi.low { background:var(--warn-bg); color:var(--warn-text); } .kpi.low b { color:inherit; }
.kpi.upd { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.stats { flex:1; min-width:0; font-size:12px; color:var(--text-muted); }
.tool-btn { background:var(--panel-2); border:1px solid var(--border-strong); color:var(--text); font-size:12px; font-weight:600; padding:5px 10px; border-radius:8px; cursor:pointer; }
.tool-btn:hover { border-color:var(--accent); color:var(--accent); }

.suggest { position:absolute; left:8px; right:8px; top:58px; z-index:30; background:var(--panel); border:1px solid var(--border-strong); border-radius:12px; box-shadow:var(--shadow); max-height:55%; overflow-y:auto; display:none; }
.sg-item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; }
.sg-item:last-child { border-bottom:none; }
.sg-item:hover, .sg-item:active { background:var(--panel-2); }
.sg-name { font-size:14px; font-weight:700; }
.sg-sku { font-size:11px; color:var(--text-muted); font-family:var(--font-code); margin-top:2px; }
.sg-loc { font-size:12px; font-weight:700; font-family:var(--font-code); background:var(--loc-bg); color:var(--loc-text); padding:4px 8px; border-radius:6px; white-space:nowrap; direction:ltr; }
.sg-empty { padding:14px; font-size:13px; color:var(--text-muted); text-align:center; }

.edit-btn { background:var(--panel-2); border:1px solid var(--border-strong); color:var(--text); font-size:12px; font-weight:600; padding:6px 10px; border-radius:8px; cursor:pointer; white-space:nowrap; }
.edit-btn:hover { border-color:var(--accent); color:var(--accent); }
.edit-form { display:none; margin-top:12px; border-top:1px solid var(--border); padding-top:12px; }
.edit-form.show { display:block; }
.edit-row { display:flex; gap:8px; margin-bottom:8px; }
.edit-row > div { flex:1; min-width:0; }
.edit-row label { display:block; font-size:11px; color:var(--text-muted); margin-bottom:4px; }
.edit-row select, .edit-row input { width:100%; padding:8px; border:1px solid var(--border-strong); border-radius:8px; background:var(--panel-2); color:var(--text); font-size:14px; }
.edit-actions { display:flex; gap:8px; }
.edit-actions button { flex:1; padding:9px; border-radius:8px; border:none; font-size:13px; font-weight:700; cursor:pointer; }
.save-btn { background:var(--accent); color:#fff; }
.cancel-btn { background:var(--panel-2); color:var(--text-secondary); border:1px solid var(--border-strong) !important; }
.edit-status { font-size:12px; margin-top:8px; text-align:center; display:none; }
.edit-status.ok { color:var(--success-text); }
.edit-status.err { color:var(--danger-text); }
.others { margin-bottom:10px; font-size:12px; color:var(--text-muted); }
.others .chip { display:inline-block; margin:4px 0 0 4px; padding:4px 10px; border-radius:999px; border:1px solid var(--border-strong); background:var(--panel-2); color:var(--text); font-size:12px; font-weight:600; cursor:pointer; }
.toast { position:absolute; top:12px; right:12px; left:auto; max-width:calc(100% - 24px); background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-size:13px; box-shadow:var(--shadow); z-index:7; opacity:0; transform:translateY(-6px); transition:opacity .2s, transform .2s; pointer-events:none; }
.toast.show { opacity:1; transform:none; }
@media (max-width:819px) {
  .result-panel { padding:12px 14px; max-height:40%; bottom:8px; left:8px; right:8px; border-radius:14px; }
  .result-header { margin-bottom:8px; }
  .result-title { font-size:15px; }
  .location-code { font-size:16px; padding:7px 12px; margin-bottom:8px; }
  .info-grid { gap:6px; margin-bottom:6px; }
  .info-item { padding:6px 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .info-item .v { margin-top:0; }
  .footer { flex-wrap:nowrap; gap:8px; padding-block:6px; }
  .kpis { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0; }
  .kpi.meta, .stats { display:none; }
  .tool-btn { padding:5px 8px; white-space:nowrap; }
  .tool-btn .long { display:none; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="topbar gutter">
    <div class="brand"><b>AZAWI</b><span>خريطة المخزن</span></div>
    <label class="search" for="searchInput">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="text" id="searchInput" placeholder="اسم المنتج أو SKU أو امسح الباركود" autocomplete="off" autofocus />
    </label>
    <button class="primary" id="searchBtn">بحث</button>
  </div>
  <div class="suggest" id="suggest"></div>
  <div class="room-chips gutter" id="roomChips"></div>
  <div class="body-area">
    <div class="canvas-wrap">
      <div class="map-tools">
        <button class="top-view-btn" id="topViewBtn">عرض المخزن كامل</button>
        <div class="legend" aria-label="دليل الألوان">
          <div><i style="background:#ffcc33"></i>المستوى المحدد</div>
          <div><i style="background:#a8b3c4"></i>مستوى رف</div>
          <div><i style="background:#a9cc7c"></i>ممر</div>
          <div><i style="background:#f5c56b"></i>المكتب</div>
        </div>
      </div>
      <div id="canvas-container"></div>
      <div class="toast" id="toast" role="status"></div>
      <div class="result-panel" id="resultPanel">
        <div class="result-header">
          <div><div class="result-title" id="rName">-</div><div class="result-sku" id="rSku">-</div></div>
          <div style="display:flex; gap:6px; align-items:flex-start;"><button class="edit-btn" id="editBtn">تعديل</button><button class="close-btn" id="closeResult" aria-label="اغلاق">&times;</button></div>
        </div>
        <div class="location-code" id="rLocation">-</div>
        <div class="info-grid">
          <div class="info-item"><div class="l">الكمية</div><div class="v" id="rQty">-</div></div>
          <div class="info-item"><div class="l">الحالة</div><div class="v"><span class="badge" id="rBadge">-</span></div></div>
        </div>
        <div class="others" id="rOthers"></div>
        <div class="edit-form" id="editForm">
          <div class="edit-row">
            <div><label>الغرفة</label><select id="editRoom"></select></div>
            <div><label>الرف</label><select id="editRack"></select></div>
            <div><label>المستوى</label><select id="editLevel"></select></div>
          </div>
          <div class="edit-row">
            <div><label>الكمية</label><input type="number" id="editQty" min="0" step="1" inputmode="numeric"></div>
          </div>
          <div class="edit-actions">
            <button class="save-btn" id="saveEditBtn">حفظ</button>
            <button class="cancel-btn" id="cancelEditBtn">إلغاء</button>
          </div>
          <div class="edit-status" id="editStatus"></div>
        </div>
      </div>
      <div class="not-found" id="notFound">ما لقينا منتج بهذا الاسم أو الرمز. تأكد من الكتابة أو جرّب SKU آخر.</div>
    </div>
  </div>
  <div class="footer gutter">
    <div class="kpis" id="kpis"></div>
    <div class="stats" id="statsBar">اضغط غرفة لرؤية رفوفها، واضغط أي مستوى لمعرفة ما عليه</div>
    <button class="tool-btn" id="importBtn">استيراد<span class="long"> Excel</span></button>
    <input type="file" id="importFile" accept=".xlsx,.xls,.csv" hidden>
    <button class="tool-btn" id="exportBtn">تصدير<span class="long"> CSV</span></button>
  </div>
</div>

    dbRef = db;
    try { const c = await db.doc('catalog/current').get(); if (c && c.exists !== false) useCatalog(typeof c.data === 'function' ? c.data() : c); } catch (e) {}
    const snap = await db.collection('locations').get();
    snap.docs.forEach(d => applyEdit(d.id, d.data()));
  } catch (e) { /* no shared db here - local storage only */ }
}

let editingSku = null;
function fillEditRoomOptions(selected) {
  const sel = document.getElementById('editRoom');
  sel.innerHTML = '';
  Object.keys(WAREHOUSE).filter(z => !WAREHOUSE[z].layout.corridor).sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)))
    .forEach(z => { const o = document.createElement('option'); o.value = z; o.textContent = z; if (z === selected) o.selected = true; sel.appendChild(o); });
}
function fillEditRackOptions(room, selected) {
  const sel = document.getElementById('editRack');
  sel.innerHTML = '';
  const racks = Object.keys((WAREHOUSE[room] || {}).aisles || {}).sort();
  racks.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; if (r === selected) o.selected = true; sel.appendChild(o); });
}
function fillEditLevelOptions(room, rack, selected) {
  const sel = document.getElementById('editLevel');
  sel.innerHTML = '';
  const nums = ((WAREHOUSE[room] || {}).aisles || {})[rack] || [];
  const max = nums.length ? Math.max(...nums) : 1;
  for (let lv = 1; lv <= max; lv++) { const o = document.createElement('option'); o.value = lv; o.textContent = lv; if (lv === selected) o.selected = true; sel.appendChild(o); }
}
function openEdit() {
  if (!editingSku) return;
  const p = PRODUCTS[editingSku];
  if (!p.room) { p.room = 'R3'; }
  fillEditRoomOptions(p.room);
  fillEditRackOptions(p.room, p.rack);
  fillEditLevelOptions(p.room, p.rack, p.level);
  document.getElementById('editQty').value = p.qty;
  document.getElementById('editStatus').style.display = 'none';
  document.getElementById('editForm').classList.add('show'); applyViewOffset();
}
function closeEdit() { document.getElementById('editForm').classList.remove('show'); applyViewOffset(); }
document.getElementById('editRoom').addEventListener('change', e => {
  fillEditRackOptions(e.target.value, null);
  fillEditLevelOptions(e.target.value, document.getElementById('editRack').value, null);
});
document.getElementById('editRack').addEventListener('change', () => {
  fillEditLevelOptions(document.getElementById('editRoom').value, document.getElementById('editRack').value, null);
});
document.getElementById('editBtn').addEventListener('click', openEdit);
document.getElementById('cancelEditBtn').addEventListener('click', closeEdit);
document.getElementById('saveEditBtn').addEventListener('click', async () => {
  const room = document.getElementById('editRoom').value;
  const rack = document.getElementById('editRack').value;
  const level = parseInt(document.getElementById('editLevel').value);
  const qty = parseInt(document.getElementById('editQty').value);
  const status = document.getElementById('editStatus');
  if (!room || !rack || !level) return;
  if (!Number.isFinite(qty) || qty < 0) { status.style.display = 'block'; status.className = 'edit-status err'; status.textContent = 'أدخل كمية صحيحة (0 أو أكثر)'; return; }
  const cur = PRODUCTS[editingSku];
  const moved = cur.room !== room || cur.rack !== rack || cur.level !== level;
  const rec = { room, rack, level, qty, extra: moved ? [] : (cur.extra || []), at: Date.now() };
  PRODUCTS[editingSku] = Object.assign({}, cur, rec);
  if (!rec.extra.length) delete PRODUCTS[editingSku].extra;
  const savedLocal = lsSave(editingSku, rec);
  status.style.display = 'block';
  if (dbRef) {
    try {
      await dbRef.collection('locations').doc(editingSku).set(rec);
      status.className = 'edit-status ok'; status.textContent = '✓ تم الحفظ — يظهر على كل الأجهزة';
    } catch (e) {
      status.className = 'edit-status err'; status.textContent = 'تعذر الحفظ على السيرفر — محفوظ على هذا الجهاز فقط';
    }
  } else {
    status.className = savedLocal ? 'edit-status ok' : 'edit-status err';
    status.textContent = savedLocal ? '✓ محفوظ على هذا الجهاز' : 'تعذر الحفظ — التغيير مؤقت';
  }
  closeEdit();
  showProduct(editingSku);
  updateStats();
});

function updateStats() {
  const list = Object.values(PRODUCTS);
  const out = list.filter(p => p.qty <= 0).length, low = list.filter(p => p.qty > 0 && p.qty <= LOW_STOCK).length;
  const k = document.getElementById('kpis'); k.innerHTML = '';
  const d = new Date(CATALOG_AT), days = Math.floor((Date.now() - CATALOG_AT) / 864e5);
  const up = document.createElement('span'); up.className = 'kpi ' + (days > 7 ? 'out' : 'upd');
  up.textContent = 'آخر تحديث ' + String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + (days > 7 ? ' (قبل ' + days + ' يوم)' : '');
  up.title = 'تاريخ آخر استيراد من دفترة'; k.appendChild(up);
  [['meta', 'غرفة', 17], ['meta', 'رف', nAisles], ['meta', 'مستوى', nLevels], ['', 'منتج', list.length], ['out', 'نافد', out], ['low', 'منخفض', low], ['out', 'بدون موقع', list.filter(p => !p.rack).length]].forEach(([c, l, n]) => {
    if (c && c !== 'meta' && !n) return;
    const e = document.createElement('span'); e.className = 'kpi ' + c;
    const b = document.createElement('b'); b.textContent = n; e.appendChild(b); e.appendChild(document.createTextNode(' ' + l)); k.appendChild(e);
  });
}
document.getElementById('exportBtn').addEventListener('click', () => {
  const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['ProductCode', 'Barcode', 'Name', 'Description', 'StockBalance', 'مكان المنتج-Custom']];
  Object.entries(PRODUCTS).forEach(([k, p]) => rows.push([k, p.barcode, p.name, p.model || '', p.qty, prodLocs(p).length ? locText(p) : '']));
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(esc).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
  (async () => {
    try {
      const dl = typeof claude !== 'undefined' ? await claude.use('downloads') : null;
      if (dl) { await dl.save({ filename: 'warehouse-products.csv', data: blob }); return; }
    } catch (e) { return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'warehouse-products.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  })();
});

// ===== Excel import (same columns as the POS backup file) =====
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = () => ok(window.XLSX); sc.onerror = () => no(new Error('load')); document.head.appendChild(sc);
  });
}
function parseLocation(raw) {
  const t = String(raw || '').trim().toUpperCase().replace(/\s+/g, '');
  const m = t.match(/^([RM]\d+)-(.+)$/); if (!m || !WAREHOUSE[m[1]]) return null;
  const locs = [];
  for (const part of m[2].split('+')) {
    const x = part.match(/^([A-Z])(\d+)$/); if (!x) return null;
    if (!locationExists(m[1], x[1], +x[2])) return null;
    locs.push([x[1], +x[2]]);
  }
  return locs.length ? { room: m[1], locs } : null;
}
function rowsToCatalog(rows) {
  const pick = (r, ...names) => { for (const n of names) { const k = Object.keys(r).find(h => h.trim().toLowerCase() === n.toLowerCase()); if (k) return r[k]; } return ''; };
  const products = {}, report = { kept: 0, zero: 0, noLoc: [] };
  rows.forEach(r => {
    const sku = String(pick(r, 'ProductCode', 'SKU')).trim(); if (!sku) return;
    const qty = Number(pick(r, 'StockBalance', 'الكمية')) || 0;
    if (qty <= 0) { report.zero++; return; }
    const loc = parseLocation(pick(r, 'مكان المنتج-Custom', 'الموقع'));
    const p = { name: String(pick(r, 'Name', 'الاسم')).replace(/\s+/g, ' ').trim(), barcode: String(pick(r, 'Barcode', 'الباركود')).trim(),
      model: String(pick(r, 'Description')).trim(), qty, room: loc ? loc.room : '', rack: loc ? loc.locs[0][0] : '', level: loc ? loc.locs[0][1] : 0 };
    if (loc && loc.locs.length > 1) p.extra = loc.locs.slice(1);
    if (!loc) report.noLoc.push(sku);
    products[sku] = p; report.kept++;
  });
  return { products, report };
}
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const bar = document.getElementById('statsBar');
  setStatus('جاري قراءة الملف...', true);
  try {
    const X = await loadXlsx();
    const wb = X.read(await f.arrayBuffer(), { type: 'array' });
    const { products, report } = rowsToCatalog(X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' }));
    if (!report.kept) { setStatus('ما لقينا منتجات بالملف. تأكد إن الأعمدة مثل ملف النسخة الاحتياطية (ProductCode, Name, StockBalance...)', true); return; }
    const cat = { at: Date.now(), products };
    useCatalog(cat);
    try { localStorage.setItem(LS_CATALOG, JSON.stringify(cat)); } catch (err) {}
    let shared = false;
    if (dbRef) { try { await dbRef.doc('catalog/current').set(cat); shared = true; } catch (err) {} }
    resetView(); updateStats();
    setStatus('تم استيراد ' + report.kept + ' منتج، وتُرك ' + report.zero + ' بكمية 0' +
      (report.noLoc.length ? '، و' + report.noLoc.length + ' بدون موقع صحيح (' + report.noLoc.slice(0, 5).join('، ') + (report.noLoc.length > 5 ? '…' : '') + ')' : '') +
      (shared ? ' — محفوظ لكل الأجهزة' : ' — محفوظ على هذا الجهاز'), true);
  } catch (err) { setStatus('تعذر قراءة الملف. جرّب تحفظه من جديد بصيغة xlsx.', true); }
});
initDb().then(updateStats); updateStats();
</script>
